# XcodeGen spec. Run `xcodegen generate` in this folder to create ClutchTavern.xcodeproj.
name: ClutchTavern
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: Packages/GameCore
targets:
  ClutchTavern:
    type: application
    platform: iOS
    sources:
      - App
      - Application
      - Features
    dependencies:
      - package: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.clutchtavern
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
